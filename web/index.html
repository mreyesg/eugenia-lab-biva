<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Viva · Organiza tu investigación</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --forest:#1F4620;
    --forest-deep:#14301A;
    --moss:#5B8C3E;
    --moss-light:#BFD9A8;
    --moss-pale:#EAF2E2;
    --cream:#FBFAF6;
    --ink:#24301F;
    --ink-soft:#4A5842;
    --accent:#8A5A2B;
    --accent-pale:#F0E4D3;
    --card:#FFFFFF;
    --danger:#A23B2E;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--cream);
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    color:var(--forest);
    margin:0 0 0.4em 0;
    line-height:1.15;
  }
  p{line-height:1.55;}
  .header{
    background:linear-gradient(160deg,var(--forest) 0%,var(--forest-deep) 100%);
    color:#fff;
    padding:22px 20px 18px 20px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .header .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .brand-main{display:flex;align-items:center;gap:10px;min-width:0;}
  .mode-switch{margin-left:auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:7px 9px;font:600 11px 'Inter',sans-serif;cursor:pointer;white-space:nowrap;}
  .brand .leaf{
    width:26px;height:26px;flex-shrink:0;
  }
  .brand-text h1{
    color:#fff;
    font-size:20px;
    margin:0;
  }
  .brand-text .tag{
    font-size:12px;
    color:var(--moss-light);
    font-style:italic;
  }
  .vine{
    display:flex;
    align-items:center;
    gap:2px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .vine::-webkit-scrollbar{display:none;}
  .vine-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
    width:34px;
  }
  .vine-line{
    height:2px;
    flex:1;
    background:rgba(255,255,255,0.25);
    min-width:8px;
  }
  .vine-line.filled{background:var(--moss-light);}
  .leaf-dot{
    width:16px;height:16px;
    border-radius:50% 0 50% 50%;
    transform:rotate(-45deg);
    border:2px solid rgba(255,255,255,0.4);
    background:transparent;
    transition:all .25s ease;
  }
  .leaf-dot.done{background:var(--moss-light);border-color:var(--moss-light);}
  .leaf-dot.current{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,0.18);}
  .step-label{
    margin-top:10px;
    font-size:13px;
    color:var(--moss-light);
    font-weight:500;
  }
  .step-label b{color:#fff;}

  main{
    flex:1;
    padding:20px 20px 100px 20px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 14px rgba(31,70,32,0.08);
  }
  .card.tint{background:var(--moss-pale);box-shadow:none;}
  .card.accent{background:var(--accent-pale);box-shadow:none;}
  label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--forest);
    margin:14px 0 6px 0;
  }
  label:first-child{margin-top:0;}
  input[type=text],textarea,select{
    width:100%;
    border:1.5px solid #DCE5D5;
    border-radius:10px;
    padding:11px 12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:#fff;
    resize:vertical;
  }
  textarea{min-height:70px;}
  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--moss);
    box-shadow:0 0 0 3px rgba(91,140,62,0.15);
  }
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius:11px;
    padding:13px 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--forest);color:#fff;width:100%;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--forest);border:1.5px solid var(--moss-light);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-row{display:flex;gap:10px;margin-top:18px;}
  .btn-row .btn{flex:1;}
  .chip{
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    background:var(--moss-pale);
    color:var(--forest);
    margin:0 6px 6px 0;
  }
  .chip.rejected{background:#F5E4E0;color:var(--danger);}
  .chip.pending{background:var(--accent-pale);color:var(--accent);}
  .option-card{
    border:1.5px solid #DCE5D5;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .option-card:hover{border-color:var(--moss);}
  .option-card.selected{border-color:var(--moss);background:var(--moss-pale);}
  .option-card h3{font-size:15.5px;margin-bottom:4px;}
  .option-card p{font-size:13.5px;color:var(--ink-soft);margin:0;}
  .ref-item{
    border:1.5px solid #DCE5D5;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
  }
  .ref-item .ref-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .ref-item h3{font-size:15px;margin-bottom:2px;}
  .ref-item .meta{font-size:12.5px;color:var(--ink-soft);}
  .status-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .status-btn{
    font-size:12px;
    padding:6px 10px;
    border-radius:8px;
    border:1.5px solid #DCE5D5;
    background:#fff;
    cursor:pointer;
    font-weight:600;
  }
  .status-btn.active-accepted{background:var(--moss);color:#fff;border-color:var(--moss);}
  .status-btn.active-rejected{background:var(--danger);color:#fff;border-color:var(--danger);}
  .status-btn.active-pending{background:var(--accent);color:#fff;border-color:var(--accent);}
  .loading{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    background:var(--moss-pale);
    border-radius:12px;
    font-size:14px;
    color:var(--forest);
    font-weight:500;
  }
  .spinner{
    width:16px;height:16px;
    border:2.5px solid var(--moss-light);
    border-top-color:var(--forest);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .footer-nav{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:520px;
    margin:0 auto;
    background:var(--cream);
    border-top:1px solid #E4DFCF;
    padding:12px 20px;
    display:flex;
    gap:10px;
  }
  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
  }
  .small-btn{
    font-size:13px;
    color:var(--forest);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .field-row{display:flex;gap:8px;}
  .field-row > *{flex:1;}
  .ai-badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:700;color:var(--moss);
    text-transform:uppercase;letter-spacing:0.4px;
    margin-bottom:8px;
  }
  .ai-badge svg{width:12px;height:12px;}
  ul.plain{margin:0;padding-left:20px;}
  ul.plain li{margin-bottom:6px;line-height:1.5;}
  .divider{height:1px;background:#E4DFCF;margin:16px 0;}
  .intro-hero{
    text-align:center;
    padding:10px 4px 4px 4px;
  }
  .intro-hero .leaf-big{width:56px;height:56px;margin-bottom:14px;}
  .final-card{
    background:var(--forest);
    color:#fff;
    border-radius:var(--radius);
    padding:24px 20px;
    text-align:center;
  }
  .final-card h2{color:#fff;}
  .final-card p{color:var(--moss-light);}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
  .mode-option{border:1.5px solid #DCE5D5;background:#fff;border-radius:10px;padding:16px;text-align:left;cursor:pointer;color:var(--ink);}
  .mode-option:hover{border-color:var(--moss);background:var(--moss-pale);}
  .mode-name{display:block;color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:6px;}
  .mode-option strong{display:block;color:var(--forest);font-size:15px;margin-bottom:7px;}
  .mode-option span{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.45;}
  .mode-option .mode-route{margin-top:10px;padding-top:9px;border-top:1px solid #E4DFCF;color:var(--forest);font-weight:600;}
  .finding{border-left:4px solid var(--moss);}
  .finding.contradiccion{border-left-color:var(--accent);}
  .finding.brecha{border-left-color:#476A8A;}
  .finding-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .report-actions{display:flex;gap:10px;margin:16px 0;}
  .report-actions .btn{flex:1;}
  @media(max-width:400px){.mode-grid{grid-template-columns:1fr;}}
  @media print{
    body,#app{background:#fff;max-width:none;}
    .header,.footer-nav,.report-actions{display:none!important;}
    main{padding:0;max-width:900px;margin:0 auto;}
    .card,.ref-item{box-shadow:none;break-inside:avoid;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CONFIG ============ */
const STAGES = [
  {key:"idea", label:"Idea inicial", short:"Idea"},
  {key:"friccion", label:"Fricción conceptual", short:"Fricción"},
  {key:"pregunta", label:"Pregunta y objetivos", short:"Pregunta"},
  {key:"mapa", label:"Componentes del trabajo", short:"Componentes"},
  {key:"bibliografia", label:"Bibliografía viva", short:"Biblio"},
  {key:"mde", label:"Matriz de Decisión", short:"Matriz"},
  {key:"sintesis", label:"Síntesis de evidencia", short:"Síntesis"},
  {key:"notas", label:"Notas de lectura", short:"Notas"},
  {key:"divulgacion", label:"Divulgación", short:"Divulgar"},
  {key:"reflexion", label:"Reflexión", short:"Reflexión"}
];

const LEAF_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C7 2 3 6 3 12c0 5 4 9 9 10 5-1 9-5 9-10 0-6-4-10-9-10Z" fill="#BFD9A8"/><path d="M12 22V6" stroke="#1F4620" stroke-width="1.4" stroke-linecap="round"/></svg>';

const AI_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6L12 2z" fill="currentColor"/></svg>';

const STORAGE_KEY = "biblioteca_viva_project";

/* ============ STATE ============ */
let state = null;
let loading = false;
// Resultados de busqueda de articulos (transitorios, no se guardan en localStorage).
let searchState = { activo: null, resultados: {}, error: {} };
// Borrador de la ficha de lectura en construcción (transitorio, no se guarda en localStorage).
let notaDraft = { refIdx: 0, idea: "", conceptos: "", relacion: "" };

function truncar(str, n){
  str = (str == null) ? "" : String(str);
  return str.length > n ? str.slice(0, n).trim() + "…" : str;
}

function defaultProject(){
  return {
    id: "proj_" + Date.now(),
    createdAt: new Date().toISOString(),
    step: -1, // -1 = intro screen
    mode: "guiado",
    idea: {tema:"", porque:"", yaSe:"", noEntiendo:"", tension:"", abstract:""},
    friccionOpciones: [],
    friccion: {seleccion:"", notas:""},
    pregunta: {problema:"", pregunta_principal:"", preguntas_secundarias:["",""], objetivo_general:"", objetivos_especificos:["",""], delimitaciones:""},
    mapa: [],
    bibliografia: [],
    reenfoque: null,
    mde: [],
    sintesis: [],
    notas: [],
    divulgacion: {formato:"", outline:null},
    reflexion: {cambio:"", referencia:"", dificultad:"", usoIA:""}
  };
}

// Rellena claves que falten en proyectos guardados antes de que existieran
// (por ejemplo, "mde" se agregó después de que algunos usuarios ya tenían progreso).
function migrateState(){
  const def = defaultProject();
  for(const k in def){
    if(state[k] === undefined) state[k] = def[k];
  }
  for(const k in def.idea){
    if(state.idea[k] === undefined) state.idea[k] = def.idea[k];
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultProject();
  }catch(e){
    state = defaultProject();
  }
  migrateState();
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("No se pudo guardar el progreso", e);
  }
}

function resetProject(){
  if(!confirm("¿Empezar un proyecto nuevo? Se perderá el progreso actual.")) return;
  state = defaultProject();
  saveState();
  render();
}

/* ============ AI HELPER ============ */
// Llama al backend propio (/api/generate), que a su vez llama a Claude con la
// clave de la API guardada de forma segura en el servidor. Nunca se expone la clave.
async function callAgent(task, payload){
  loading = true; render();
  try{
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({task, payload})
    });
    if(!response.ok){
      let msg = "No se pudo generar la sugerencia.";
      try{ const err = await response.json(); if(err && err.error) msg = err.error; }catch(e){}
      throw new Error(msg);
    }
    const data = await response.json();
    return data.result;
  }catch(e){
    console.error("Error llamando al agente:", e);
    alert(e.message || "No se pudo generar la sugerencia. Revisa tu conexión e inténtalo de nuevo.");
    return null;
  }finally{
    loading = false; render();
  }
}

/* ============ NAVIGATION ============ */
function goToStep(i){
  state.step = i;
  saveState();
  render();
  window.scrollTo(0,0);
}
function workflowStages(){
  if(state.mode !== "investigador") return STAGES.map((s,i)=>i);
  const keys = ["idea","mapa","bibliografia","mde","sintesis","notas","divulgacion"];
  return keys.map(k=>STAGES.findIndex(s=>s.key===k));
}
function nextStep(){
  const flow = workflowStages();
  const pos = flow.indexOf(state.step);
  goToStep(flow[Math.min(pos+1, flow.length-1)]);
}
function prevStep(){
  const flow = workflowStages();
  const pos = flow.indexOf(state.step);
  goToStep(flow[Math.max(pos-1, 0)]);
}

// Requisito minimo para poder avanzar de cada paso (los demas no bloquean).
function stepComplete(i){
  const k = STAGES[i].key;
  if(k === "idea") {
    const tema = !!(state.idea.tema && state.idea.tema.trim());
    if(state.mode === "investigador") return tema && !!(state.pregunta.pregunta_principal && state.pregunta.pregunta_principal.trim());
    return tema;
  }
  if(k === "friccion") return !!(state.friccion.seleccion && state.friccion.seleccion.trim());
  if(k === "pregunta") return !!(state.pregunta.pregunta_principal && state.pregunta.pregunta_principal.trim());
  return true;
}
function continueHint(i){
  const k = STAGES[i].key;
  if(k === "idea") return state.mode === "investigador" ? "Escribe el tema y la pregunta principal para continuar." : "Escribe al menos el tema para continuar.";
  if(k === "friccion") return "Elige o escribe una fricción conceptual para continuar.";
  if(k === "pregunta") return "Necesitas al menos la pregunta principal para continuar.";
  return "";
}
// Actualiza el estado del boton Continuar sin re-renderizar (para no perder el foco al escribir).
function refreshNav(){
  const complete = stepComplete(state.step);
  const nextBtn = document.getElementById("btnNext");
  if(nextBtn) nextBtn.disabled = !complete;
  const finishBtn = document.getElementById("btnFinish");
  if(finishBtn) finishBtn.disabled = !complete;
  const hintEl = document.getElementById("navHint");
  if(hintEl) hintEl.style.display = complete ? "none" : "";
}

/* ============ RENDER SHELL ============ */
function render(){
  const app = document.getElementById("app");
  if(!state){ app.innerHTML = "<div class='empty'>Cargando…</div>"; return; }

  if(state.step === -1){
    app.innerHTML = renderIntro();
    attachIntroHandlers();
    return;
  }

  app.innerHTML = `
    ${renderHeader()}
    <main>${renderStep(state.step)}</main>
    ${renderFooterNav()}
  `;
  attachStepHandlers(state.step);
}

function renderHeader(){
  const flow = workflowStages();
  const currentPos = flow.indexOf(state.step);
  const nodes = flow.map((stageIdx,pos) => {
    const cls = pos < currentPos ? "done" : (stageIdx === state.step ? "current" : "");
    const lineCls = pos < currentPos ? "filled" : "";
    return `
      ${pos>0 ? `<div class="vine-line ${lineCls}"></div>` : ""}
      <div class="vine-node" data-step="${stageIdx}">
        <div class="leaf-dot ${cls}"></div>
      </div>
    `;
  }).join("");

  return `
  <div class="header">
    <div class="brand">
      <div class="brand-main">
        <div class="leaf">${LEAF_SVG}</div>
        <div class="brand-text">
          <h1>Biblioteca Viva</h1>
          <div class="tag">${state.mode === "investigador" ? "Modo investigador · evidencia directa" : "Modo guiado · formulación paso a paso"}</div>
        </div>
      </div>
      <button class="mode-switch" id="btnChangeMode">Cambiar modo</button>
    </div>
    <div class="vine">${nodes}</div>
    <div class="step-label">Etapa ${currentPos+1} de ${flow.length} · <b>${STAGES[state.step].label}</b></div>
  </div>`;
}

function renderFooterNav(){
  const flow = workflowStages();
  const isLast = state.step === flow[flow.length - 1];
  const complete = stepComplete(state.step);
  const backBtn = flow.indexOf(state.step) > 0
    ? `<button class="btn btn-ghost" id="btnBack">Atrás</button>`
    : `<button class="btn btn-ghost" id="btnHome">Inicio</button>`;
  const fwdBtn = !isLast
    ? `<button class="btn btn-primary" id="btnNext" ${complete?'':'disabled'}>Continuar</button>`
    : `<button class="btn btn-primary" id="btnFinish" ${complete?'':'disabled'}>Ver resumen</button>`;
  const hintText = continueHint(state.step);
  return `
  <div class="footer-nav" style="flex-direction:column;align-items:stretch;gap:0;">
    <div class="hint" id="navHint" style="text-align:center;margin:0 0 8px 0;${complete?'display:none;':''}">${hintText}</div>
    <div style="display:flex;gap:10px;">${backBtn}${fwdBtn}</div>
  </div>`;
}

/* ============ INTRO ============ */
function renderIntro(){
  return `
  <div class="header">
    <div class="brand">
      <div class="leaf">${LEAF_SVG}</div>
      <div class="brand-text">
        <h1>Biblioteca Viva</h1>
        <div class="tag">Un compañero de investigación paso a paso</div>
      </div>
    </div>
  </div>
  <main>
    <div class="intro-hero">
      <h2>Fortalece tu investigación con la mejor evidencia</h2>
      <p>Una herramienta para investigadores y estudiantes graduados: encuentra las fuentes que mejor sostienen cada parte de tu trabajo, y tradúcelas en criterios de decisión con la Matriz de Decisión. Sirve igual para empezar un proyecto o para reforzar uno en curso.</p>
    </div>
    <div style="margin-top:18px;">
      <h3 style="font-size:18px;margin-bottom:4px;">¿Cómo quieres comenzar?</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">Escoge según lo que ya tienes. Ambos modos llegan al mismo motor de evidencia.</p>
    </div>
    <div class="mode-grid">
      <button class="mode-option" id="btnResearcher">
        <span class="mode-name">Modo investigador</span>
        <strong>Ya tengo una pregunta, propuesta o abstract</strong>
        <span>Para proyectos en curso. Entras con tu material existente y omites la formulación básica.</span>
        <span class="mode-route">Pregunta o abstract → evidencia → decisiones</span>
      </button>
      <button class="mode-option" id="btnGuided">
        <span class="mode-name">Modo guiado</span>
        <strong>Todavía estoy definiendo mi investigación</strong>
        <span>Para quien comienza con un tema. EugenIA ayuda a construir la fricción, la pregunta y los objetivos.</span>
        <span class="mode-route">Idea → pregunta → evidencia → decisiones</span>
      </button>
    </div>
    <div class="card">

}

function attachIntroHandlers(){

/* ============ STEP DISPATCH ============ */
function renderStep(i){
  const key = STAGES[i].key;
  if(loading){
    return renderLoadingCard();
  }
  switch(key){
    case "idea": return renderIdea();
    case "friccion": return renderFriccion();
    case "pregunta": return renderPregunta();
    case "mapa": return renderMapa();
    case "bibliografia": return renderBibliografia();
    case "mde": return renderMDE();
    case "sintesis": return renderSintesis();
    case "notas": return renderNotas();
    case "divulgacion": return renderDivulgacion();
    case "reflexion": return renderReflexion();
    default: return "";
  }
}

function renderLoadingCard(){
  return `<div class="loading"><div class="spinner"></div> EugenIA está pensando en tu proyecto…</div>`;
}

/* ============ STEP 1: IDEA ============ */

async function sugerirFricciones(){

/* ============ REENFOQUE (dentro de Bibliografía) ============ */
// Permite reformular el foco de la investigación a partir de los artículos que el
// investigador realmente aceptó, aunque impliquen un giro respecto al foco original.
// La IA propone; el investigador adopta o conserva el original (nunca sobreescribe solo).
function renderReenfoque(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  if(aceptadas.length < 2) return "";
  const p = state.reenfoque;
  const gen = `
    <div class="card accent" style="margin-top:16px;">
      <h3 style="font-size:15px;margin:0 0 6px 0;">¿Tu lectura cambió tu enfoque?</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 12px 0;">A veces los artículos que más te interesan apuntan a una pregunta distinta de la que empezaste. EugenIA puede proponerte un enfoque reformulado a partir de las ${aceptadas.length} referencias que aceptaste. Tú decides si lo adoptas o conservas el original.</p>
      <button class="btn btn-accent" id="btnReenfocar" style="width:100%;">${p?"Proponer otro enfoque":"Reenfocar desde mis artículos"}</button>
    </div>`;
  if(!p) return gen;
  const chips = (Array.isArray(p.fuentes)?p.fuentes:[])
    .map(n=>aceptadas[n-1]).filter(Boolean)
    .map(r=>{
      const u = refUrl(r); const et = escapeHtml(truncar(r.titulo,55));
      return u
        ? `<a href="${escapeAttr(u)}" target="_blank" rel="noopener" style="display:inline-block;font-size:12px;background:var(--moss-light);color:var(--forest);border-radius:10px;padding:3px 9px;margin:3px 4px 0 0;text-decoration:none;">${et}</a>`
        : `<span style="display:inline-block;font-size:12px;background:var(--moss-light);color:var(--forest);border-radius:10px;padding:3px 9px;margin:3px 4px 0 0;">${et}</span>`;
    }).join("");
  const objs = (Array.isArray(p.objetivos_especificos)?p.objetivos_especificos:[])
    .map(o=>`<li>${escapeHtml(o)}</li>`).join("");
  return gen + `
    <div class="ai-badge">${AI_ICON} Enfoque propuesto por EugenIA</div>
    <div class="card tint">
      <h3 style="font-size:15px;margin:0 0 8px 0;">${escapeHtml(p.tema)}</h3>
      <p style="font-size:13.5px;margin:0 0 8px 0;"><b>Pregunta principal:</b> ${escapeHtml(p.pregunta_principal)}</p>
      <p style="font-size:13.5px;margin:0 0 8px 0;"><b>Objetivo general:</b> ${escapeHtml(p.objetivo_general)}</p>
      ${objs?`<div style="font-size:13.5px;margin:0 0 8px 0;"><b>Objetivos específicos:</b><ul class="plain" style="margin:4px 0 0 0;">${objs}</ul></div>`:""}
      <p style="font-size:13.5px;margin:0 0 8px 0;"><b>Por qué este giro:</b> ${escapeHtml(p.justificacion_giro)}</p>
      <div style="border-top:1px solid #E4DFCF;padding-top:8px;">
        <span class="hint" style="display:block;margin-bottom:2px;">Sostenido por:</span>
        ${chips||`<span class="hint">Sin fuentes específicas.</span>`}
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn btn-ghost" id="btnDescartarReenfoque" style="flex:1;">Conservar el original</button>
        <button class="btn btn-primary" id="btnAdoptarReenfoque" style="flex:1;">Adoptar este enfoque</button>
      </div>
    </div>`;
}

function attachReenfoqueHandlers(){
  const b = document.getElementById("btnReenfocar");
  if(b) b.onclick = generarReenfoque;
  const a = document.getElementById("btnAdoptarReenfoque");
  if(a) a.onclick = adoptarReenfoque;
  const d = document.getElementById("btnDescartarReenfoque");
  if(d) d.onclick = descartarReenfoque;
}

async function generarReenfoque(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  if(aceptadas.length < 2) return;
  const referencias = aceptadas.map(r=>({
    titulo: r.titulo, autores: r.autores, anio: r.anio,
    resumen: r.resumen || "", justificacion: r.justificacion || ""
  }));
  const result = await callAgent("reenfoque", {
    idea: state.idea, pregunta: state.pregunta, referencias
  });
  if(result){ state.reenfoque = result; saveState(); }
  render();
}

function adoptarReenfoque(){
  const p = state.reenfoque;
  if(!p) return;
  if(!confirm("Esto actualizará tu tema, pregunta y objetivos con el enfoque propuesto. Podrás seguir editándolos a mano. ¿Adoptar?")) return;
  if(p.tema) state.idea.tema = p.tema;
  if(p.problema) state.pregunta.problema = p.problema;
  if(p.pregunta_principal) state.pregunta.pregunta_principal = p.pregunta_principal;
  if(p.objetivo_general) state.pregunta.objetivo_general = p.objetivo_general;
  if(Array.isArray(p.objetivos_especificos) && p.objetivos_especificos.length){
    state.pregunta.objetivos_especificos = p.objetivos_especificos.slice();
  }
  state.reenfoque = null;
  saveState();
  goToStep(STAGES.findIndex(s=>s.key==="pregunta"));
}

function descartarReenfoque(){
  state.reenfoque = null;
  saveState();
  render();
}

// Señales bibliométricas de una fuente, como chips: tipo de documento, ajuste
// temático (evaluado por IA), revista y acceso abierto. Las citas y el año van
// en la línea de meta, aparte.
function signalChips(r){
  const chips = [];
  if(r.fuente) chips.push(`<span class="chip" style="background:#E2EDF3;color:#31566B;">Fuente: ${escapeHtml(r.fuente)}</span>`);
  if(r.tipo_doc) chips.push(`<span class="chip" style="background:#ECEAE3;color:#5B5B50;">${escapeHtml(r.tipo_doc)}</span>`);
  if(r.fuerza === "alta") chips.push(`<span class="chip">Ajuste directo</span>`);
  else if(r.fuerza === "media") chips.push(`<span class="chip pending">Ajuste parcial</span>`);
  else if(r.fuerza === "baja") chips.push(`<span class="chip" style="background:#ECEAE3;color:#6B6B60;">Ajuste tangencial</span>`);
  if(r.revista) chips.push(`<span class="chip" style="background:#ECEAE3;color:#5B5B50;">${escapeHtml(truncar(r.revista,28))}</span>`);
  if(r.oa) chips.push(`<span class="chip">Acceso abierto</span>`);
  if(!chips.length) return "";
  return `<div style="margin-top:8px;">${chips.join("")}</div>`;
}

function renderPerspectivaBusqueda(m, i){
  const key = m.perspectiva;
  const buscando = searchState.activo === key;
  const res = searchState.resultados[key];
  const err = searchState.error[key];
  return `
  <div class="card">
    <h3 style="font-size:15px;">${escapeHtml(m.perspectiva)}</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 10px 0;">${escapeHtml(m.que_necesito)}</p>
    ${buscando
      ? `<div class="loading"><div class="spinner"></div> Buscando artículos reales…</div>`
      : `<button class="btn ${res?'btn-ghost':'btn-accent'} buscar-btn" data-idx="${i}" style="width:100%;">${res?'Buscar otra vez':'Buscar artículos'}</button>`}
    ${err ? `<p class="hint" style="color:var(--danger);">${escapeHtml(err)}</p>` : ""}
    ${(res && res.length===0) ? `<p class="hint">No se encontraron artículos. Prueba a afinar tu tema o pregunta.</p>` : ""}
    ${(res && res.length>0) ? res.map((c,j)=>renderCandidato(key,c,j)).join("") : ""}
  </div>`;
}

function renderCandidato(key, c, j){
  const yaAgregado = state.bibliografia.some(r => (c.doi && r.doi===c.doi) || r.titulo===c.titulo);
  return `
  <div class="ref-item" style="margin-top:10px;">
    <h3 style="font-size:14.5px;">${escapeHtml(c.titulo)}</h3>
    <div class="meta">${escapeHtml(c.autores)}${c.anio?(' · '+escapeHtml(String(c.anio))):''}${typeof c.citas==='number'?(' · '+c.citas+' citas'):''}</div>
    ${signalChips(c)}
    ${c.aporte ? `<p style="font-size:13px;margin:8px 0 0 0;"><b>Aporte a tu investigación:</b> ${escapeHtml(c.aporte)}</p>` : ""}
    ${c.resumen ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 0 0;">${escapeHtml(truncar(c.resumen,240))}</p>` : ""}
    <div class="status-row">
      ${c.url ? `<a class="status-btn" href="${escapeAttr(c.url)}" target="_blank" rel="noopener">Ver fuente</a>` : ""}
      <button class="status-btn add-cand" data-key="${escapeAttr(key)}" data-idx="${j}" ${yaAgregado?'disabled':''} style="${yaAgregado?'':'background:var(--moss);color:#fff;border-color:var(--moss);'}">${yaAgregado?'Ya añadido':'Añadir a mi bibliografía'}</button>
    </div>
  </div>`;
}

async function buscarArticulos(i){
  const m = state.mapa[i];
  if(!m) return;
  const key = m.perspectiva;
  searchState.activo = key;
  searchState.error[key] = null;
  render();
  try{
    const resp = await fetch("/api/search", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        perspectiva: m.perspectiva,
        que_necesito: m.que_necesito,
        contexto: {
          tema: state.idea.tema,
          abstract: state.idea.abstract,
          problema: state.pregunta.problema,
          pregunta_principal: state.pregunta.pregunta_principal
        }
      })
    });
    if(!resp.ok){
      let msg = "No se pudo buscar artículos.";
      try{ const e = await resp.json(); if(e && e.error) msg = e.error; }catch(_){}
      throw new Error(msg);
    }
    const data = await resp.json();
    searchState.resultados[key] = data.resultados || [];
  }catch(e){
    console.error("Error buscando artículos:", e);
    searchState.error[key] = e.message || "No se pudo buscar. Inténtalo de nuevo.";
  }finally{
    searchState.activo = null;
    render();
  }
}

function agregarReferencia(c, perspectiva){
  const dup = state.bibliografia.some(r => (c.doi && r.doi===c.doi) || r.titulo===c.titulo);
  if(dup) return;
  state.bibliografia.push({
    titulo: c.titulo,
    autores: c.autores || "",
    anio: c.anio || "",
    justificacion: c.aporte || "",
    estado: "pendiente",
    doi: c.doi || "",
    url: c.url || "",
    oa: !!c.oa,
    citas: (typeof c.citas === "number") ? c.citas : null,
    revista: c.revista || "",
    tipo_doc: c.tipo_doc || "",
    fuerza: c.fuerza || "",
    resumen: c.resumen || "",
    fuente: c.fuente || "OpenAlex",
    perspectiva: perspectiva
  });
  saveState(); render();
}

function attachBibliografiaHandlers(){
  const btn = document.getElementById("btnAddRef");
  if(btn) btn.onclick = () => {
    const titulo = document.getElementById("ref_titulo").value.trim();
    if(!titulo){ alert("Escribe al menos el título."); return; }
    state.bibliografia.push({
      titulo,
      autores: document.getElementById("ref_autores").value,
      anio: document.getElementById("ref_anio").value,
      justificacion: document.getElementById("ref_justificacion").value,
      estado: "pendiente"
    });
    saveState(); render();
  };
  document.querySelectorAll(".status-btn[data-i]").forEach(b=>{
    b.onclick = () => {
      const i = parseInt(b.dataset.i);
      state.bibliografia[i].estado = b.dataset.estado;
      saveState(); render();
    };
  });
  document.querySelectorAll(".buscar-btn").forEach(b=>{
    b.onclick = () => buscarArticulos(parseInt(b.dataset.idx));
  });
  document.querySelectorAll(".add-cand").forEach(b=>{
    b.onclick = () => {
      const key = b.dataset.key;
      const idx = parseInt(b.dataset.idx);
      const cand = (searchState.resultados[key] || [])[idx];
      if(cand) agregarReferencia(cand, key);
    };
  });
  attachReenfoqueHandlers();
}

/* ============ STEP 6: MATRIZ DE DECISIÓN ============ */
// Traduce la evidencia curada (referencias aceptadas) en criterios de decisión.
// Las dimensiones las genera la IA según el campo del proyecto, para servir a
// cualquier disciplina. Cada fila enlaza a las fuentes reales que la sostienen;
// nunca se inventan datos ni citas (ver docs/vision-app.md).
function refUrl(r){
  if(r && r.url) return r.url;
  if(r && r.doi) return "https://doi.org/" + r.doi;
  return "";
}

function renderMDE(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  const mde = state.mde || [];
  if(aceptadas.length === 0){
    return `<div class="card tint"><p style="margin:0;">La Matriz de Decisión se construye a partir de tus referencias aceptadas. Vuelve a <b>Bibliografía viva</b> y acepta al menos unas cuantas fuentes para poder generarla.</p></div>`;
  }
  const intro = `
    <div class="card">
      <p style="margin:0 0 10px 0;">La <b>Matriz de Decisión</b> convierte la evidencia que ya curaste en criterios operativos concretos para tu investigación. EugenIA propone las dimensiones de decisión según tu campo, y sostiene cada una con tus fuentes reales.</p>
      <p class="hint" style="margin:0 0 12px 0;">Basada en ${aceptadas.length} referencia(s) aceptada(s). Revisa y ajusta cada criterio con tu propio juicio antes de adoptarlo.</p>
      <button class="btn btn-accent" id="btnGenerarMDE" style="width:100%;">${mde.length ? "Regenerar matriz" : "Generar Matriz de Decisión"}</button>
    </div>`;
  if(mde.length === 0){
    return intro + `<div class="empty">Aún no has generado la matriz.</div>`;
  }
  const filas = mde.map(d=>{
    const chips = (Array.isArray(d.fuentes)?d.fuentes:[])
      .map(n=>aceptadas[n-1])
      .filter(Boolean)
      .map(r=>{
        const u = refUrl(r);
        const etiqueta = escapeHtml(truncar(r.titulo, 60));
        return u
          ? `<a href="${escapeAttr(u)}" target="_blank" rel="noopener" style="display:inline-block;font-size:12px;background:var(--moss-light);color:var(--forest);border-radius:10px;padding:3px 9px;margin:3px 4px 0 0;text-decoration:none;">${etiqueta}</a>`
          : `<span style="display:inline-block;font-size:12px;background:var(--moss-light);color:var(--forest);border-radius:10px;padding:3px 9px;margin:3px 4px 0 0;">${etiqueta}</span>`;
      }).join("");
    return `
      <div class="card tint">
        <h3 style="font-size:15px;margin:0 0 8px 0;">${escapeHtml(d.dimension)}</h3>
        <p style="font-size:13.5px;margin:0 0 8px 0;"><b>Evidencia curada:</b> ${escapeHtml(d.hallazgo_evidencia)}</p>
        <p style="font-size:13.5px;margin:0 0 8px 0;"><b>Criterio adoptado:</b> ${escapeHtml(d.criterio_adoptado)}</p>
        <div style="border-top:1px solid #E4DFCF;padding-top:8px;">
          <span class="hint" style="display:block;margin-bottom:2px;">Sostenido por:</span>
          ${chips || `<span class="hint">Sin fuentes específicas asignadas.</span>`}
        </div>
      </div>`;
  }).join("");
  return `
    <div class="ai-badge">${AI_ICON} Matriz generada por EugenIA</div>
    ${filas}
    ${intro}`;
}

function attachMdeHandlers(){
  const btn = document.getElementById("btnGenerarMDE");
  if(btn) btn.onclick = generarMDE;
}

async function generarMDE(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  if(aceptadas.length === 0) return;
  const referencias = aceptadas.map(r=>({
    titulo: r.titulo,
    autores: r.autores,
    anio: r.anio,
    resumen: r.resumen || "",
    justificacion: r.justificacion || "",
    doi: r.doi || "",
    url: r.url || ""
  }));
  const result = await callAgent("mde", {
    idea: state.idea,
    pregunta: state.pregunta,
    referencias
  });
  if(result && Array.isArray(result)){
    state.mde = result;
    saveState();
  }
  render();
}

/* ============ SÍNTESIS DE EVIDENCIA ============ */
function renderSourceLinks(fuentes, refs){
  return (Array.isArray(fuentes)?fuentes:[])
    .map(n=>refs[n-1])
    .filter(Boolean)
    .map(r=>{
      const url = refUrl(r);
      const label = escapeHtml(truncar(r.titulo, 58));
      return url
        ? `<a class="chip" href="${escapeAttr(url)}" target="_blank" rel="noopener" style="text-decoration:none;">${label}</a>`
        : `<span class="chip">${label}</span>`;
    }).join("");
}

function renderSintesis(){
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  const hallazgos = state.sintesis || [];
  if(refs.length < 2){
    return `<div class="card tint"><p style="margin:0;">La síntesis comparativa necesita al menos dos referencias aceptadas. Vuelve a <b>Bibliografía viva</b> para ampliar el corpus.</p></div>`;
  }
  const intro = `
    <div class="card">
      <h3>Síntesis trazable</h3>
      <p>Compara el corpus seleccionado para revelar convergencias, contradicciones y preguntas que todavía no resuelve.</p>
      <p class="hint">El análisis se basa en los resúmenes disponibles. Una brecha aquí significa una brecha del corpus seleccionado, no necesariamente de toda la literatura.</p>
      <button class="btn btn-accent" id="btnSintesis" style="width:100%;">${hallazgos.length?"Regenerar síntesis":"Analizar evidencia aceptada"}</button>
    </div>`;
  if(!hallazgos.length) return intro;
  const cards = hallazgos.map(h=>`
    <div class="card finding ${escapeAttr(h.tipo)}">
      <div class="finding-label">${escapeHtml(h.tipo)} · confianza ${escapeHtml(h.confianza)}</div>
      <h3 style="font-size:16px;">${escapeHtml(h.hallazgo)}</h3>
      <p style="font-size:13.5px;"><b>Implicación para el proyecto:</b> ${escapeHtml(h.implicacion)}</p>
      <div>${renderSourceLinks(h.fuentes, refs) || `<span class="hint">Sin fuentes específicas asignadas.</span>`}</div>
    </div>`).join("");
  return `<div class="ai-badge">${AI_ICON} Síntesis generada por EugenIA</div>${cards}${intro}`;
}

function attachSintesisHandlers(){
  const btn = document.getElementById("btnSintesis");
  if(btn) btn.onclick = generarSintesis;
}

async function generarSintesis(){
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  if(refs.length < 2) return;
  const referencias = refs.map(r=>({
    titulo:r.titulo, autores:r.autores, anio:r.anio,
    resumen:r.resumen||"", justificacion:r.justificacion||""
  }));
  const result = await callAgent("sintesis", {idea:state.idea, pregunta:state.pregunta, referencias});
  if(result && Array.isArray(result)){
    state.sintesis = result;
    saveState();
  }
  render();
}

/* ============ STEP 7: NOTAS DE LECTURA ============ */
// Nota de diseño (ver CLAUDE.md y docs/decisions.md 2026-07-12): este paso sigue
// siendo manual por principio (la curación crítica no se delega a un atajo
// automático). La IA aquí es una SUGERENCIA opcional que el estudiante debe
// revisar y editar, nunca un resultado final que se guarda sin pasar por sus manos.
function renderNotas(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  const notas = state.notas;
  if(notaDraft.refIdx >= aceptadas.length) notaDraft.refIdx = 0;
  const refSeleccionada = aceptadas[notaDraft.refIdx];
  const tieneResumen = !!(refSeleccionada && refSeleccionada.resumen && refSeleccionada.resumen.trim());
  return `
  ${aceptadas.length === 0 ? `<div class="card tint"><p style="margin:0;">Aún no tienes referencias aceptadas. Vuelve al paso anterior y acepta al menos una para crear una ficha de lectura.</p></div>` : `
    <div class="card">
      <label>Referencia</label>
      <select id="nota_ref">
        ${aceptadas.map((r,i)=>`<option value="${i}" ${i===notaDraft.refIdx?'selected':''}>${escapeHtml(r.titulo)}</option>`).join("")}
      </select>
      <button class="btn btn-ghost" id="btnSugerirNota" type="button" style="width:100%;margin:8px 0;" ${!tieneResumen?'disabled':''}>${AI_ICON} Sugerir con IA</button>
      ${!tieneResumen ? `<p class="hint">Esta referencia se añadió a mano y no tiene un resumen real, así que EugenIA no puede sugerir una ficha. Complétala tú directamente.</p>` : `<p class="hint">EugenIA propone un borrador a partir del resumen real del artículo. Revísalo y ajústalo con tu propio criterio antes de guardar.</p>`}
      <label>Idea principal</label>
      <textarea id="nota_idea">${escapeHtml(notaDraft.idea)}</textarea>
      <label>Conceptos clave</label>
      <textarea id="nota_conceptos">${escapeHtml(notaDraft.conceptos)}</textarea>
      <label>Relación con mi investigación</label>
      <textarea id="nota_relacion">${escapeHtml(notaDraft.relacion)}</textarea>
      <button class="btn btn-primary" id="btnAddNota" style="width:100%;margin-top:12px;">Guardar ficha</button>
    </div>
  `}
  ${notas.length === 0 ? `<div class="empty">Aún no has creado fichas de lectura.</div>` : notas.map(n=>`
    <div class="card tint">
      <h3 style="font-size:15px;">${escapeHtml(n.titulo)}</h3>
      <p style="font-size:13.5px;"><b>Idea principal:</b> ${escapeHtml(n.idea)}</p>
      <p style="font-size:13.5px;"><b>Conceptos:</b> ${escapeHtml(n.conceptos)}</p>
      <p style="font-size:13.5px;margin:0;"><b>Relación:</b> ${escapeHtml(n.relacion)}</p>
    </div>
  `).join("")}`;
}

function attachNotasHandlers(){
  const sel = document.getElementById("nota_ref");
  if(sel) sel.onchange = () => {
    notaDraft.refIdx = parseInt(sel.value);
    notaDraft.idea = ""; notaDraft.conceptos = ""; notaDraft.relacion = "";
    render();
  };
  ["nota_idea","nota_conceptos","nota_relacion"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const draftKey = id.replace("nota_","");
    el.oninput = () => { notaDraft[draftKey] = el.value; };
  });
  const btnSugerir = document.getElementById("btnSugerirNota");
  if(btnSugerir) btnSugerir.onclick = generarNota;
  const btn = document.getElementById("btnAddNota");
  if(btn) btn.onclick = () => {
    const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
    const ref = aceptadas[notaDraft.refIdx];
    state.notas.push({
      titulo: ref.titulo,
      idea: document.getElementById("nota_idea").value,
      conceptos: document.getElementById("nota_conceptos").value,
      relacion: document.getElementById("nota_relacion").value
    });
    notaDraft = { refIdx: 0, idea: "", conceptos: "", relacion: "" };
    saveState(); render();
  };
}

async function generarNota(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  const ref = aceptadas[notaDraft.refIdx];
  if(!ref || !ref.resumen) return;
  const result = await callAgent("notas", {
    referencia: ref,
    idea: state.idea,
    pregunta: state.pregunta
  });
  if(result){
    notaDraft.idea = result.idea_principal || "";
    notaDraft.conceptos = Array.isArray(result.conceptos_clave) ? result.conceptos_clave.join(", ") : "";
    notaDraft.relacion = result.relacion_investigacion || "";
    render();
  }
}

  `;
  document.getElementById("btnInforme").onclick = showEvidenceReport;
  document.getElementById("btnVolverEditar").onclick = () => {
    const flow = workflowStages();
    goToStep(flow[flow.length-1]);
  };
  document.getElementById("btnNuevoProyecto").onclick = resetProject;
}

function citationText(r, i){
  const doi = r.doi ? ` DOI: ${String(r.doi).replace(/^https?:\/\/(dx\.)?doi\.org\//i,"")}.` : "";
  return `[${i+1}] ${r.autores||"Autor no disponible"} (${r.anio||"s.f."}). ${r.titulo}.${r.revista?` ${r.revista}.`:""}${doi}`;
}

function reportSection(title, body){
  return `<section class="card"><h2 style="font-size:20px;">${title}</h2>${body}</section>`;
}

function showEvidenceReport(){
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  const synthesis = (state.sintesis||[]).map(h=>`
    <div class="finding ${escapeAttr(h.tipo)}" style="padding:12px 14px;margin:10px 0;">
      <div class="finding-label">${escapeHtml(h.tipo)} · confianza ${escapeHtml(h.confianza)}</div>
      <p><b>${escapeHtml(h.hallazgo)}</b></p>
      <p>${escapeHtml(h.implicacion)}</p>
      <p class="hint">Fuentes: ${(h.fuentes||[]).map(n=>`[${n}]`).join(", ")||"No asignadas"}</p>
    </div>`).join("") || `<p>No se ha generado una síntesis.</p>`;
  const matrix = (state.mde||[]).map(d=>`
    <tr><td>${escapeHtml(d.dimension)}</td><td>${escapeHtml(d.hallazgo_evidencia)}</td><td>${escapeHtml(d.criterio_adoptado)}</td><td>${(d.fuentes||[]).map(n=>`[${n}]`).join(", ")}</td></tr>`).join("");
  const matrixHtml = matrix ? `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;"><thead><tr><th>Dimensión</th><th>Evidencia</th><th>Criterio</th><th>Fuentes</th></tr></thead><tbody>${matrix}</tbody></table></div>` : `<p>No se ha generado una Matriz de Decisión.</p>`;
  const bibliography = refs.map((r,i)=>`<li style="margin-bottom:10px;">${escapeHtml(citationText(r,i))}</li>`).join("") || `<li>No hay referencias aceptadas.</li>`;
  const app = document.getElementById("app");
  app.innerHTML = `<main style="padding-bottom:40px;">
    <div class="final-card"><h1 style="color:#fff;font-size:25px;">Informe de evidencia</h1><p>Biblioteca Viva · EugenIA Lab</p></div>
    <div class="report-actions">
      <button class="btn btn-ghost" id="btnBackReport">Volver</button>
      <button class="btn btn-ghost" id="btnTextReport">Descargar texto</button>
      <button class="btn btn-primary" id="btnPrintReport">Imprimir / PDF</button>
    </div>
    ${reportSection("Foco de investigación", `<p><b>Tema:</b> ${escapeHtml(state.idea.tema)}</p><p><b>Pregunta:</b> ${escapeHtml(state.pregunta.pregunta_principal)}</p><p><b>Objetivo:</b> ${escapeHtml(state.pregunta.objetivo_general)||"No definido"}</p>`)}
    ${reportSection("Síntesis de evidencia", synthesis)}
    ${reportSection("Matriz de Decisión", matrixHtml)}
    ${reportSection("Referencias aceptadas", `<ol style="padding-left:22px;">${bibliography}</ol>`)}
    <p class="hint">Análisis generado a partir de títulos y resúmenes disponibles. Debe verificarse contra los textos completos antes de publicación o toma de decisiones definitiva.</p>
  </main>`;
  document.querySelectorAll("th,td").forEach(el=>{el.style.border="1px solid #DCE5D5";el.style.padding="8px";el.style.textAlign="left";el.style.verticalAlign="top";});
  document.getElementById("btnBackReport").onclick = showSummary;
  document.getElementById("btnPrintReport").onclick = () => window.print();
  document.getElementById("btnTextReport").onclick = downloadEvidenceReport;
  window.scrollTo(0,0);
}

function downloadEvidenceReport(){
  const refs = state.bibliografia.filter(r=>r.estado==="aceptada");
  const lines = [
    "INFORME DE EVIDENCIA | BIBLIOTECA VIVA",
    "", `Tema: ${state.idea.tema}`, `Pregunta: ${state.pregunta.pregunta_principal}`,
    `Objetivo: ${state.pregunta.objetivo_general||"No definido"}`, "", "SÍNTESIS DE EVIDENCIA"
  ];
  (state.sintesis||[]).forEach(h=>lines.push(`\n${h.tipo.toUpperCase()} | Confianza ${h.confianza}\n${h.hallazgo}\nImplicación: ${h.implicacion}\nFuentes: ${(h.fuentes||[]).map(n=>`[${n}]`).join(", ")}`));
  lines.push("", "MATRIZ DE DECISIÓN");
  (state.mde||[]).forEach(d=>lines.push(`\n${d.dimension}\nEvidencia: ${d.hallazgo_evidencia}\nCriterio: ${d.criterio_adoptado}\nFuentes: ${(d.fuentes||[]).map(n=>`[${n}]`).join(", ")}`));
  lines.push("", "REFERENCIAS");
  refs.forEach((r,i)=>lines.push(citationText(r,i)));
  lines.push("", "Nota: análisis basado en títulos y resúmenes disponibles; verificar con los textos completos.");
  const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "informe-evidencia-biblioteca-viva.txt";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ============ UTILS ============ */
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

/* ============ INIT ============ */
loadState();
</script>
