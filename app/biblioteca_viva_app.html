<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Viva · Organiza tu investigación</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --forest:#1F4620;
    --forest-deep:#14301A;
    --moss:#5B8C3E;
    --moss-light:#BFD9A8;
    --moss-pale:#EAF2E2;
    --cream:#FBFAF6;
    --ink:#24301F;
    --ink-soft:#4A5842;
    --accent:#8A5A2B;
    --accent-pale:#F0E4D3;
    --card:#FFFFFF;
    --danger:#A23B2E;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--cream);
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    color:var(--forest);
    margin:0 0 0.4em 0;
    line-height:1.15;
  }
  p{line-height:1.55;}
  .header{
    background:linear-gradient(160deg,var(--forest) 0%,var(--forest-deep) 100%);
    color:#fff;
    padding:22px 20px 18px 20px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .header .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .brand .leaf{
    width:26px;height:26px;flex-shrink:0;
  }
  .brand-text h1{
    color:#fff;
    font-size:20px;
    margin:0;
  }
  .brand-text .tag{
    font-size:12px;
    color:var(--moss-light);
    font-style:italic;
  }
  .vine{
    display:flex;
    align-items:center;
    gap:2px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .vine::-webkit-scrollbar{display:none;}
  .vine-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
    width:34px;
  }
  .vine-line{
    height:2px;
    flex:1;
    background:rgba(255,255,255,0.25);
    min-width:8px;
  }
  .vine-line.filled{background:var(--moss-light);}
  .leaf-dot{
    width:16px;height:16px;
    border-radius:50% 0 50% 50%;
    transform:rotate(-45deg);
    border:2px solid rgba(255,255,255,0.4);
    background:transparent;
    transition:all .25s ease;
  }
  .leaf-dot.done{background:var(--moss-light);border-color:var(--moss-light);}
  .leaf-dot.current{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,0.18);}
  .step-label{
    margin-top:10px;
    font-size:13px;
    color:var(--moss-light);
    font-weight:500;
  }
  .step-label b{color:#fff;}

  main{
    flex:1;
    padding:20px 20px 100px 20px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 14px rgba(31,70,32,0.08);
  }
  .card.tint{background:var(--moss-pale);box-shadow:none;}
  .card.accent{background:var(--accent-pale);box-shadow:none;}
  label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--forest);
    margin:14px 0 6px 0;
  }
  label:first-child{margin-top:0;}
  input[type=text],textarea,select{
    width:100%;
    border:1.5px solid #DCE5D5;
    border-radius:10px;
    padding:11px 12px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:#fff;
    resize:vertical;
  }
  textarea{min-height:70px;}
  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--moss);
    box-shadow:0 0 0 3px rgba(91,140,62,0.15);
  }
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius:11px;
    padding:13px 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--forest);color:#fff;width:100%;}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--forest);border:1.5px solid var(--moss-light);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-row{display:flex;gap:10px;margin-top:18px;}
  .btn-row .btn{flex:1;}
  .chip{
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    background:var(--moss-pale);
    color:var(--forest);
    margin:0 6px 6px 0;
  }
  .chip.rejected{background:#F5E4E0;color:var(--danger);}
  .chip.pending{background:var(--accent-pale);color:var(--accent);}
  .option-card{
    border:1.5px solid #DCE5D5;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .option-card:hover{border-color:var(--moss);}
  .option-card.selected{border-color:var(--moss);background:var(--moss-pale);}
  .option-card h3{font-size:15.5px;margin-bottom:4px;}
  .option-card p{font-size:13.5px;color:var(--ink-soft);margin:0;}
  .ref-item{
    border:1.5px solid #DCE5D5;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
  }
  .ref-item .ref-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .ref-item h3{font-size:15px;margin-bottom:2px;}
  .ref-item .meta{font-size:12.5px;color:var(--ink-soft);}
  .status-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .status-btn{
    font-size:12px;
    padding:6px 10px;
    border-radius:8px;
    border:1.5px solid #DCE5D5;
    background:#fff;
    cursor:pointer;
    font-weight:600;
  }
  .status-btn.active-accepted{background:var(--moss);color:#fff;border-color:var(--moss);}
  .status-btn.active-rejected{background:var(--danger);color:#fff;border-color:var(--danger);}
  .status-btn.active-pending{background:var(--accent);color:#fff;border-color:var(--accent);}
  .loading{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    background:var(--moss-pale);
    border-radius:12px;
    font-size:14px;
    color:var(--forest);
    font-weight:500;
  }
  .spinner{
    width:16px;height:16px;
    border:2.5px solid var(--moss-light);
    border-top-color:var(--forest);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .footer-nav{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:520px;
    margin:0 auto;
    background:var(--cream);
    border-top:1px solid #E4DFCF;
    padding:12px 20px;
    display:flex;
    gap:10px;
  }
  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
  }
  .small-btn{
    font-size:13px;
    color:var(--forest);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .field-row{display:flex;gap:8px;}
  .field-row > *{flex:1;}
  .ai-badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:700;color:var(--moss);
    text-transform:uppercase;letter-spacing:0.4px;
    margin-bottom:8px;
  }
  .ai-badge svg{width:12px;height:12px;}
  ul.plain{margin:0;padding-left:20px;}
  ul.plain li{margin-bottom:6px;line-height:1.5;}
  .divider{height:1px;background:#E4DFCF;margin:16px 0;}
  .intro-hero{
    text-align:center;
    padding:10px 4px 4px 4px;
  }
  .intro-hero .leaf-big{width:56px;height:56px;margin-bottom:14px;}
  .final-card{
    background:var(--forest);
    color:#fff;
    border-radius:var(--radius);
    padding:24px 20px;
    text-align:center;
  }
  .final-card h2{color:#fff;}
  .final-card p{color:var(--moss-light);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CONFIG ============ */
const STAGES = [
  {key:"idea", label:"Idea inicial", short:"Idea"},
  {key:"friccion", label:"Fricción conceptual", short:"Fricción"},
  {key:"pregunta", label:"Pregunta y objetivos", short:"Pregunta"},
  {key:"mapa", label:"Mapa bibliográfico", short:"Mapa"},
  {key:"bibliografia", label:"Bibliografía viva", short:"Biblio"},
  {key:"notas", label:"Notas de lectura", short:"Notas"},
  {key:"divulgacion", label:"Divulgación", short:"Divulgar"},
  {key:"reflexion", label:"Reflexión", short:"Reflexión"}
];

const LEAF_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C7 2 3 6 3 12c0 5 4 9 9 10 5-1 9-5 9-10 0-6-4-10-9-10Z" fill="#BFD9A8"/><path d="M12 22V6" stroke="#1F4620" stroke-width="1.4" stroke-linecap="round"/></svg>';

const AI_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6L12 2z" fill="currentColor"/></svg>';

/* ============ STATE ============ */
let state = null;
let loading = false;

function defaultProject(){
  return {
    id: "proj_" + Date.now(),
    createdAt: new Date().toISOString(),
    step: -1, // -1 = intro screen
    idea: {tema:"", porque:"", yaSe:"", noEntiendo:"", tension:""},
    friccionOpciones: [],
    friccion: {seleccion:"", notas:""},
    pregunta: {problema:"", pregunta_principal:"", preguntas_secundarias:["",""], objetivo_general:"", objetivos_especificos:["",""], delimitaciones:""},
    mapa: [],
    bibliografia: [],
    notas: [],
    divulgacion: {formato:"", outline:null},
    reflexion: {cambio:"", referencia:"", dificultad:"", usoIA:""}
  };
}

async function loadState(){
  try{
    const res = await window.storage.get("current_project");
    state = res ? JSON.parse(res.value) : defaultProject();
  }catch(e){
    state = defaultProject();
  }
  render();
}

async function saveState(){
  try{
    await window.storage.set("current_project", JSON.stringify(state));
  }catch(e){
    console.error("No se pudo guardar el progreso", e);
  }
}

function resetProject(){
  if(!confirm("¿Empezar un proyecto nuevo? Se perderá el progreso actual.")) return;
  state = defaultProject();
  saveState();
  render();
}

/* ============ AI HELPER ============ */
async function callClaudeJSON(systemPrompt, userPrompt){
  loading = true; render();
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1400,
        system: systemPrompt,
        messages: [{role:"user", content: userPrompt}]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    const cleaned = textBlocks.replace(/```json/g, "").replace(/```/g, "").trim();
    return JSON.parse(cleaned);
  }catch(e){
    console.error("Error llamando al agente:", e);
    return null;
  }finally{
    loading = false; render();
  }
}

/* ============ NAVIGATION ============ */
function goToStep(i){
  state.step = i;
  saveState();
  render();
  window.scrollTo(0,0);
}
function nextStep(){ goToStep(Math.min(state.step+1, STAGES.length-1)); }
function prevStep(){ goToStep(Math.max(state.step-1, 0)); }

/* ============ RENDER SHELL ============ */
function render(){
  const app = document.getElementById("app");
  if(!state){ app.innerHTML = "<div class='empty'>Cargando…</div>"; return; }

  if(state.step === -1){
    app.innerHTML = renderIntro();
    attachIntroHandlers();
    return;
  }

  app.innerHTML = `
    ${renderHeader()}
    <main>${renderStep(state.step)}</main>
    ${renderFooterNav()}
  `;
  attachStepHandlers(state.step);
}

function renderHeader(){
  const nodes = STAGES.map((s,i) => {
    const cls = i < state.step ? "done" : (i === state.step ? "current" : "");
    const lineCls = i < state.step ? "filled" : "";
    return `
      ${i>0 ? `<div class="vine-line ${lineCls}"></div>` : ""}
      <div class="vine-node" data-step="${i}">
        <div class="leaf-dot ${cls}"></div>
      </div>
    `;
  }).join("");

  return `
  <div class="header">
    <div class="brand">
      <div class="leaf">${LEAF_SVG}</div>
      <div class="brand-text">
        <h1>Biblioteca Viva</h1>
        <div class="tag">Organiza tu investigación, paso a paso</div>
      </div>
    </div>
    <div class="vine">${nodes}</div>
    <div class="step-label">Paso ${state.step+1} de ${STAGES.length} · <b>${STAGES[state.step].label}</b></div>
  </div>`;
}

function renderFooterNav(){
  const isLast = state.step === STAGES.length - 1;
  return `
  <div class="footer-nav">
    ${state.step > 0 ? `<button class="btn btn-ghost" id="btnBack">Atrás</button>` : `<button class="btn btn-ghost" id="btnHome">Inicio</button>`}
    ${!isLast ? `<button class="btn btn-primary" id="btnNext">Continuar</button>` : `<button class="btn btn-primary" id="btnFinish">Ver resumen</button>`}
  </div>`;
}

/* ============ INTRO ============ */
function renderIntro(){
  return `
  <div class="header">
    <div class="brand">
      <div class="leaf">${LEAF_SVG}</div>
      <div class="brand-text">
        <h1>Biblioteca Viva</h1>
        <div class="tag">Un compañero de investigación paso a paso</div>
      </div>
    </div>
  </div>
  <main>
    <div class="intro-hero">
      <h2>De una idea a una investigación organizada</h2>
      <p>Esta app te acompaña por las ocho etapas que usamos en EugenIA Lab para convertir una idea en un proyecto con pregunta clara, bibliografía justificada y un producto de divulgación.</p>
    </div>
    <div class="card tint">
      <h3>Las ocho etapas</h3>
      <ul class="plain">
        ${STAGES.map((s,i)=>`<li><b>${i+1}. ${s.label}</b></li>`).join("")}
      </ul>
    </div>
    <div class="card">
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">Tu progreso se guarda automáticamente en este dispositivo. Puedes cerrar la app y volver cuando quieras.</p>
    </div>
    <button class="btn btn-primary" id="btnStart">Comenzar mi proyecto</button>
  </main>`;
}

function attachIntroHandlers(){
  document.getElementById("btnStart").onclick = () => { goToStep(0); };
}

/* ============ STEP DISPATCH ============ */
function renderStep(i){
  const key = STAGES[i].key;
  if(loading){
    return renderLoadingCard();
  }
  switch(key){
    case "idea": return renderIdea();
    case "friccion": return renderFriccion();
    case "pregunta": return renderPregunta();
    case "mapa": return renderMapa();
    case "bibliografia": return renderBibliografia();
    case "notas": return renderNotas();
    case "divulgacion": return renderDivulgacion();
    case "reflexion": return renderReflexion();
    default: return "";
  }
}

function renderLoadingCard(){
  return `<div class="loading"><div class="spinner"></div> EugenIA está pensando en tu proyecto…</div>`;
}

/* ============ STEP 1: IDEA ============ */
function renderIdea(){
  const d = state.idea;
  return `
  <div class="card">
    <label>¿Qué tema te interesa investigar?</label>
    <input type="text" id="f_tema" value="${escapeAttr(d.tema)}" placeholder="Ej. propiedades del orégano brujo">
    <label>¿Por qué te interesa?</label>
    <textarea id="f_porque" placeholder="Tu motivación personal o académica">${d.porque}</textarea>
    <label>¿Qué crees que ya sabes sobre el tema?</label>
    <textarea id="f_yaSe">${d.yaSe}</textarea>
    <label>¿Qué no entiendes todavía?</label>
    <textarea id="f_noEntiendo">${d.noEntiendo}</textarea>
    <label>¿Qué contradicción, duda o problema te llama la atención?</label>
    <textarea id="f_tension" placeholder="Opcional, si ya tienes una intuición">${d.tension}</textarea>
  </div>`;
}

function attachIdeaHandlers(){
  ["tema","porque","yaSe","noEntiendo","tension"].forEach(k=>{
    const el = document.getElementById("f_"+k);
    if(el) el.oninput = () => { state.idea[k] = el.value; saveState(); };
  });
}

/* ============ STEP 2: FRICCIÓN ============ */
function renderFriccion(){
  const d = state.friccion;
  const hasOptions = state.friccionOpciones && state.friccionOpciones.length > 0;
  return `
  ${!hasOptions ? `
    <div class="card">
      <p>Con base en tu idea inicial, EugenIA puede sugerir posibles tensiones (fricciones conceptuales) que justifiquen una investigación.</p>
      <button class="btn btn-accent" id="btnSugerirFriccion" style="width:100%;">Sugerir fricciones conceptuales</button>
    </div>
  ` : `
    <div class="ai-badge">${AI_ICON} Sugerido por EugenIA</div>
    ${state.friccionOpciones.map((op,i)=>`
      <div class="option-card ${d.seleccion===op.titulo?'selected':''}" data-idx="${i}">
        <h3>${op.titulo}</h3>
        <p>${op.descripcion}</p>
      </div>
    `).join("")}
    <button class="small-btn" id="btnRegenerar">Generar otras opciones</button>
  `}
  <div class="card" style="margin-top:14px;">
    <label>Fricción conceptual elegida (puedes editarla)</label>
    <textarea id="f_seleccion" placeholder="Escribe o ajusta la tensión que sostendrá tu investigación">${d.seleccion}</textarea>
    <label>Notas adicionales</label>
    <textarea id="f_notas">${d.notas}</textarea>
  </div>`;
}

function attachFriccionHandlers(){
  const btn = document.getElementById("btnSugerirFriccion");
  if(btn) btn.onclick = sugerirFricciones;
  const btnRegen = document.getElementById("btnRegenerar");
  if(btnRegen) btnRegen.onclick = sugerirFricciones;

  document.querySelectorAll(".option-card").forEach(card=>{
    card.onclick = () => {
      const idx = parseInt(card.dataset.idx);
      const op = state.friccionOpciones[idx];
      state.friccion.seleccion = op.titulo + ": " + op.descripcion;
      saveState(); render();
    };
  });
  const selEl = document.getElementById("f_seleccion");
  if(selEl) selEl.oninput = () => { state.friccion.seleccion = selEl.value; saveState(); };
  const notasEl = document.getElementById("f_notas");
  if(notasEl) notasEl.oninput = () => { state.friccion.notas = notasEl.value; saveState(); };
}

async function sugerirFricciones(){
  const d = state.idea;
  const system = "Eres un asistente de investigación que ayuda a estudiantes universitarios a identificar fricciones conceptuales (tensiones que justifican investigar algo). Respondes UNICAMENTE con JSON valido, sin texto adicional ni markdown.";
  const user = `Tema: ${d.tema}\nPor que le interesa: ${d.porque}\nQue cree que ya sabe: ${d.yaSe}\nQue no entiende todavia: ${d.noEntiendo}\nIntuicion de tension: ${d.tension}\n\nGenera un array JSON de exactamente 4 objetos con esta forma: [{"titulo": "...", "descripcion": "..."}]. Cada titulo debe ser corto (menos de 8 palabras) y cada descripcion debe explicar en 1-2 oraciones una tension conceptual real y especifica a este tema (por ejemplo: una creencia popular versus evidencia cientifica, una practica comun versus sus riesgos, una explicacion aceptada versus casos que no encajan). Responde solo el JSON, sin texto antes ni despues.`;
  const result = await callClaudeJSON(system, user);
  if(result && Array.isArray(result)){
    state.friccionOpciones = result;
    saveState();
  }
  render();
}

/* ============ STEP 3: PREGUNTA Y OBJETIVOS ============ */
function renderPregunta(){
  const d = state.pregunta;
  const hasDraft = d.problema && d.problema.length > 0;
  return `
  ${!hasDraft ? `
    <div class="card">
      <p>EugenIA puede convertir tu fricción conceptual en un problema investigable, una pregunta principal y objetivos.</p>
      <button class="btn btn-accent" id="btnGenerarPregunta" style="width:100%;">Redactar pregunta y objetivos</button>
    </div>
  ` : `<div class="ai-badge">${AI_ICON} Borrador de EugenIA, edítalo libremente</div>`}
  <div class="card">
    <label>Problema investigable</label>
    <textarea id="f_problema">${d.problema}</textarea>
    <label>Pregunta principal</label>
    <textarea id="f_pregunta_principal">${d.pregunta_principal}</textarea>
    <label>Preguntas secundarias</label>
    <input type="text" id="f_ps0" value="${escapeAttr(d.preguntas_secundarias[0]||'')}" placeholder="Pregunta secundaria 1">
    <input type="text" id="f_ps1" value="${escapeAttr(d.preguntas_secundarias[1]||'')}" placeholder="Pregunta secundaria 2" style="margin-top:8px;">
    <label>Objetivo general</label>
    <textarea id="f_objetivo_general">${d.objetivo_general}</textarea>
    <label>Objetivos específicos</label>
    <input type="text" id="f_oe0" value="${escapeAttr(d.objetivos_especificos[0]||'')}" placeholder="Objetivo específico 1">
    <input type="text" id="f_oe1" value="${escapeAttr(d.objetivos_especificos[1]||'')}" placeholder="Objetivo específico 2" style="margin-top:8px;">
    <label>Delimitaciones</label>
    <textarea id="f_delimitaciones">${d.delimitaciones}</textarea>
  </div>
  ${hasDraft ? `<button class="small-btn" id="btnRegenerarPregunta">Generar otro borrador</button>` : ""}
  `;
}

function attachPreguntaHandlers(){
  const btn = document.getElementById("btnGenerarPregunta");
  if(btn) btn.onclick = generarPregunta;
  const btnR = document.getElementById("btnRegenerarPregunta");
  if(btnR) btnR.onclick = generarPregunta;

  const map = {
    f_problema:"problema", f_pregunta_principal:"pregunta_principal",
    f_objetivo_general:"objetivo_general", f_delimitaciones:"delimitaciones"
  };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = () => { state.pregunta[map[id]] = el.value; saveState(); };
  });
  ["f_ps0","f_ps1"].forEach((id,i)=>{
    const el = document.getElementById(id);
    if(el) el.oninput = () => { state.pregunta.preguntas_secundarias[i] = el.value; saveState(); };
  });
  ["f_oe0","f_oe1"].forEach((id,i)=>{
    const el = document.getElementById(id);
    if(el) el.oninput = () => { state.pregunta.objetivos_especificos[i] = el.value; saveState(); };
  });
}

async function generarPregunta(){
  const system = "Eres un asistente de investigacion que ayuda a estudiantes a formular problemas investigables. Respondes UNICAMENTE con JSON valido, sin texto adicional ni markdown.";
  const user = `Idea inicial: ${JSON.stringify(state.idea)}\nFriccion conceptual elegida: ${state.friccion.seleccion}\n\nGenera un objeto JSON con esta forma exacta: {"problema": "...", "pregunta_principal": "...", "preguntas_secundarias": ["...", "..."], "objetivo_general": "...", "objetivos_especificos": ["...", "..."], "delimitaciones": "..."}. Todo en espanol, especifico al tema, breve y claro. Responde solo el JSON.`;
  const result = await callClaudeJSON(system, user);
  if(result){
    state.pregunta = {...state.pregunta, ...result};
    saveState();
  }
  render();
}

/* ============ STEP 4: MAPA BIBLIOGRÁFICO ============ */
function renderMapa(){
  const hasMap = state.mapa && state.mapa.length > 0;
  return `
  ${!hasMap ? `
    <div class="card">
      <p>El mapa bibliográfico define qué perspectivas necesita cubrir tu literatura, antes de buscar artículos.</p>
      <button class="btn btn-accent" id="btnGenerarMapa" style="width:100%;">Generar mapa bibliográfico</button>
    </div>
  ` : `
    <div class="ai-badge">${AI_ICON} Sugerido por EugenIA</div>
    ${state.mapa.map((m,i)=>`
      <div class="card tint">
        <h3 style="font-size:15px;">${m.perspectiva}</h3>
        <p style="font-size:14px;margin:0;">${m.que_necesito}</p>
      </div>
    `).join("")}
    <button class="small-btn" id="btnRegenerarMapa">Regenerar mapa</button>
  `}`;
}

function attachMapaHandlers(){
  const btn = document.getElementById("btnGenerarMapa");
  if(btn) btn.onclick = generarMapa;
  const btnR = document.getElementById("btnRegenerarMapa");
  if(btnR) btnR.onclick = generarMapa;
}

async function generarMapa(){
  const system = "Eres un asistente de investigacion. Respondes UNICAMENTE con JSON valido, sin texto adicional ni markdown.";
  const user = `Tema: ${state.idea.tema}\nProblema: ${state.pregunta.problema}\nPregunta principal: ${state.pregunta.pregunta_principal}\n\nGenera un array JSON de exactamente 5 objetos, uno por cada perspectiva: Conceptual, Contextual, Empirica, Metodologica, Critica. Cada objeto con forma {"perspectiva": "Conceptual", "que_necesito": "..."} donde que_necesito es una frase especifica de 1-2 oraciones sobre que debe cubrir esa perspectiva PARA ESTE TEMA en particular, no una definicion generica. Responde solo el JSON.`;
  const result = await callClaudeJSON(system, user);
  if(result && Array.isArray(result)){
    state.mapa = result;
    saveState();
  }
  render();
}

/* ============ STEP 5: BIBLIOGRAFÍA VIVA ============ */
function renderBibliografia(){
  const refs = state.bibliografia;
  return `
  <div class="card">
    <label>Título</label>
    <input type="text" id="ref_titulo" placeholder="Título del artículo o libro">
    <div class="field-row" style="margin-top:8px;">
      <div><label>Autores</label><input type="text" id="ref_autores"></div>
      <div><label>Año</label><input type="text" id="ref_anio"></div>
    </div>
    <label>¿Por qué podría servir a tu proyecto?</label>
    <textarea id="ref_justificacion" placeholder="Justificación breve"></textarea>
    <button class="btn btn-primary" id="btnAddRef" style="width:100%;margin-top:12px;">Añadir referencia</button>
  </div>
  ${refs.length === 0 ? `<div class="empty">Aún no has añadido referencias.</div>` : refs.map((r,i)=>`
    <div class="ref-item">
      <div class="ref-top">
        <div>
          <h3>${escapeHtml(r.titulo)}</h3>
          <div class="meta">${escapeHtml(r.autores||'')} ${r.anio?('· '+escapeHtml(r.anio)):''}</div>
        </div>
      </div>
      ${r.justificacion ? `<p style="font-size:13.5px;margin:8px 0 0 0;">${escapeHtml(r.justificacion)}</p>` : ""}
      <div class="status-row">
        <button class="status-btn ${r.estado==='aceptada'?'active-accepted':''}" data-i="${i}" data-estado="aceptada">Aceptar</button>
        <button class="status-btn ${r.estado==='pendiente'?'active-pending':''}" data-i="${i}" data-estado="pendiente">Pendiente</button>
        <button class="status-btn ${r.estado==='rechazada'?'active-rejected':''}" data-i="${i}" data-estado="rechazada">Rechazar</button>
      </div>
    </div>
  `).join("")}`;
}

function attachBibliografiaHandlers(){
  const btn = document.getElementById("btnAddRef");
  if(btn) btn.onclick = () => {
    const titulo = document.getElementById("ref_titulo").value.trim();
    if(!titulo){ alert("Escribe al menos el título."); return; }
    state.bibliografia.push({
      titulo,
      autores: document.getElementById("ref_autores").value,
      anio: document.getElementById("ref_anio").value,
      justificacion: document.getElementById("ref_justificacion").value,
      estado: "pendiente"
    });
    saveState(); render();
  };
  document.querySelectorAll(".status-btn").forEach(b=>{
    b.onclick = () => {
      const i = parseInt(b.dataset.i);
      state.bibliografia[i].estado = b.dataset.estado;
      saveState(); render();
    };
  });
}

/* ============ STEP 6: NOTAS DE LECTURA ============ */
function renderNotas(){
  const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
  const notas = state.notas;
  return `
  ${aceptadas.length === 0 ? `<div class="card tint"><p style="margin:0;">Aún no tienes referencias aceptadas. Vuelve al paso anterior y acepta al menos una para crear una ficha de lectura.</p></div>` : `
    <div class="card">
      <label>Referencia</label>
      <select id="nota_ref">
        ${aceptadas.map((r,i)=>`<option value="${i}">${escapeHtml(r.titulo)}</option>`).join("")}
      </select>
      <label>Idea principal</label>
      <textarea id="nota_idea"></textarea>
      <label>Conceptos clave</label>
      <textarea id="nota_conceptos"></textarea>
      <label>Relación con mi investigación</label>
      <textarea id="nota_relacion"></textarea>
      <button class="btn btn-primary" id="btnAddNota" style="width:100%;margin-top:12px;">Guardar ficha</button>
    </div>
  `}
  ${notas.length === 0 ? `<div class="empty">Aún no has creado fichas de lectura.</div>` : notas.map(n=>`
    <div class="card tint">
      <h3 style="font-size:15px;">${escapeHtml(n.titulo)}</h3>
      <p style="font-size:13.5px;"><b>Idea principal:</b> ${escapeHtml(n.idea)}</p>
      <p style="font-size:13.5px;"><b>Conceptos:</b> ${escapeHtml(n.conceptos)}</p>
      <p style="font-size:13.5px;margin:0;"><b>Relación:</b> ${escapeHtml(n.relacion)}</p>
    </div>
  `).join("")}`;
}

function attachNotasHandlers(){
  const btn = document.getElementById("btnAddNota");
  if(btn) btn.onclick = () => {
    const aceptadas = state.bibliografia.filter(r=>r.estado==="aceptada");
    const idx = parseInt(document.getElementById("nota_ref").value);
    const ref = aceptadas[idx];
    state.notas.push({
      titulo: ref.titulo,
      idea: document.getElementById("nota_idea").value,
      conceptos: document.getElementById("nota_conceptos").value,
      relacion: document.getElementById("nota_relacion").value
    });
    saveState(); render();
  };
}

/* ============ STEP 7: DIVULGACIÓN ============ */
const FORMATOS = ["Presentación oral","Póster académico","Informe final","Mini paper","Video educativo","Página web","Infografía"];

function renderDivulgacion(){
  const d = state.divulgacion;
  return `
  <div class="card">
    <label>¿Cómo quieres divulgar tu investigación?</label>
    <select id="div_formato">
      <option value="">Selecciona un formato</option>
      ${FORMATOS.map(f=>`<option value="${f}" ${d.formato===f?'selected':''}>${f}</option>`).join("")}
    </select>
    <button class="btn btn-accent" id="btnGenerarOutline" style="width:100%;margin-top:14px;" ${!d.formato?'disabled':''}>Generar estructura</button>
  </div>
  ${d.outline ? `
    <div class="ai-badge">${AI_ICON} Estructura sugerida por EugenIA</div>
    ${d.outline.estructura.map((s,i)=>`
      <div class="card tint">
        <h3 style="font-size:15px;">${i+1}. ${escapeHtml(s.seccion)}</h3>
        <p style="font-size:13.5px;margin:0;">${escapeHtml(s.contenido_breve)}</p>
      </div>
    `).join("")}
    <button class="small-btn" id="btnRegenerarOutline">Generar otra estructura</button>
  ` : ""}`;
}

function attachDivulgacionHandlers(){
  const sel = document.getElementById("div_formato");
  if(sel) sel.onchange = () => {
    state.divulgacion.formato = sel.value;
    state.divulgacion.outline = null;
    saveState(); render();
  };
  const btn = document.getElementById("btnGenerarOutline");
  if(btn) btn.onclick = generarOutline;
  const btnR = document.getElementById("btnRegenerarOutline");
  if(btnR) btnR.onclick = generarOutline;
}

async function generarOutline(){
  const system = "Eres un asistente de divulgacion cientifica. Respondes UNICAMENTE con JSON valido, sin texto adicional ni markdown.";
  const user = `Formato elegido: ${state.divulgacion.formato}\nTema: ${state.idea.tema}\nProblema: ${state.pregunta.problema}\nPregunta principal: ${state.pregunta.pregunta_principal}\nObjetivo general: ${state.pregunta.objetivo_general}\nReferencias aceptadas: ${state.bibliografia.filter(r=>r.estado==='aceptada').map(r=>r.titulo).join('; ')}\n\nGenera un objeto JSON con forma {"estructura": [{"seccion":"...", "contenido_breve":"..."}]} con entre 5 y 8 secciones apropiadas para el formato elegido, en espanol, especificas a este proyecto. Responde solo el JSON.`;
  const result = await callClaudeJSON(system, user);
  if(result){
    state.divulgacion.outline = result;
    saveState();
  }
  render();
}

/* ============ STEP 8: REFLEXIÓN ============ */
function renderReflexion(){
  const d = state.reflexion;
  return `
  <div class="card">
    <label>¿Cómo cambió tu idea inicial?</label>
    <textarea id="r_cambio">${d.cambio}</textarea>
    <label>¿Qué referencia cambió tu manera de pensar?</label>
    <textarea id="r_referencia">${d.referencia}</textarea>
    <label>¿Qué dificultad encontraste?</label>
    <textarea id="r_dificultad">${d.dificultad}</textarea>
    <label>¿En qué momento la IA te ayudó a pensar, y en qué momento pudo llevarte por mal camino?</label>
    <textarea id="r_usoIA">${d.usoIA}</textarea>
  </div>`;
}

function attachReflexionHandlers(){
  const map = {r_cambio:"cambio", r_referencia:"referencia", r_dificultad:"dificultad", r_usoIA:"usoIA"};
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = () => { state.reflexion[map[id]] = el.value; saveState(); };
  });
}

/* ============ HANDLER DISPATCH + NAV BUTTONS ============ */
function attachStepHandlers(i){
  const key = STAGES[i].key;
  const fns = {
    idea: attachIdeaHandlers,
    friccion: attachFriccionHandlers,
    pregunta: attachPreguntaHandlers,
    mapa: attachMapaHandlers,
    bibliografia: attachBibliografiaHandlers,
    notas: attachNotasHandlers,
    divulgacion: attachDivulgacionHandlers,
    reflexion: attachReflexionHandlers
  };
  if(fns[key]) fns[key]();

  const btnBack = document.getElementById("btnBack");
  if(btnBack) btnBack.onclick = prevStep;
  const btnHome = document.getElementById("btnHome");
  if(btnHome) btnHome.onclick = () => { goToStep(-1); };
  const btnNext = document.getElementById("btnNext");
  if(btnNext) btnNext.onclick = nextStep;
  const btnFinish = document.getElementById("btnFinish");
  if(btnFinish) btnFinish.onclick = showSummary;
}

/* ============ SUMMARY ============ */
function showSummary(){
  const app = document.getElementById("app");
  const p = state;
  app.innerHTML = `
    ${renderHeader()}
    <main>
      <div class="final-card">
        <h2>Tu proyecto está organizado</h2>
        <p>Este es un resumen de tu recorrido por Biblioteca Viva.</p>
      </div>
      <div class="card" style="margin-top:16px;">
        <h3 style="font-size:15px;">Tema</h3>
        <p>${escapeHtml(p.idea.tema)||"(sin definir)"}</p>
        <div class="divider"></div>
        <h3 style="font-size:15px;">Pregunta principal</h3>
        <p>${escapeHtml(p.pregunta.pregunta_principal)||"(sin definir)"}</p>
        <div class="divider"></div>
        <h3 style="font-size:15px;">Referencias</h3>
        <p>${p.bibliografia.filter(r=>r.estado==='aceptada').length} aceptadas de ${p.bibliografia.length} añadidas</p>
        <div class="divider"></div>
        <h3 style="font-size:15px;">Formato de divulgación</h3>
        <p>${p.divulgacion.formato || "(sin elegir)"}</p>
      </div>
      <button class="btn btn-ghost" id="btnVolverEditar" style="width:100%;margin-bottom:10px;">Volver a editar</button>
      <button class="btn btn-primary" id="btnNuevoProyecto" style="width:100%;">Empezar un proyecto nuevo</button>
    </main>
  `;
  document.getElementById("btnVolverEditar").onclick = () => { goToStep(STAGES.length-1); };
  document.getElementById("btnNuevoProyecto").onclick = resetProject;
}

/* ============ UTILS ============ */
function escapeHtml(str){
  if(!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(str){
  if(!str) return "";
  return str.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

/* ============ INIT ============ */
loadState();
</script>
</body>
</html>
